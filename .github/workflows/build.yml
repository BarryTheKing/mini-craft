name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          docker run --rm -v "$PWD":/root/src -w /root/src notfl3/cargo-apk sh -c '
            rustup update stable
            rustup default stable
            rustup target add armv7-linux-androideabi aarch64-linux-android
            V=$(ls /opt/android-sdk-linux/platforms | sed -E "s/^android-([0-9]+).*/\1/" | sort -n | tail -1)
            echo "Kullanilan Android surumu: $V"
            sed -i "s/^android_version = .*/android_version = $V/; s/^target_sdk_version = .*/target_sdk_version = $V/" Cargo.toml
            cargo quad-apk build
          '
      - uses: actions/upload-artifact@v4
        with:
          name: mini_craft-apk
          path: target/android-artifacts/debug/apk/mini_craft.apk
